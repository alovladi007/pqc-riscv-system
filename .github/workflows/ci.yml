name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Opt into Node 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    name: Python reference + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements.txt
      - name: Install
        working-directory: python
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: python
        run: pytest tests/ -v
      - name: Benchmark (smoke)
        working-directory: python
        run: python bench.py --iters 50

  verilator-lint:
    name: Verilator lint (RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
      - name: Lint kyber_q_alu
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/kyber_q_alu.sv
      - name: Lint ntt_butterfly
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/ntt_butterfly.sv
      - name: Lint ntt_inv_butterfly
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/ntt_inv_butterfly.sv
      - name: Lint keccak_round
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/keccak_round.sv
      - name: Lint ntt_engine (with butterfly deps)
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/ntt_butterfly.sv rtl/ntt_inv_butterfly.sv rtl/ntt_engine.sv --top-module ntt_engine
      - name: Lint keccak_f1600 (with keccak_round dep)
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/keccak_round.sv rtl/keccak_f1600.sv --top-module keccak_f1600
      - name: Lint sha3_256 (with keccak deps)
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/keccak_round.sv rtl/keccak_f1600.sv rtl/sha3_256.sv --top-module sha3_256
      - name: Lint shake_128 (with keccak deps)
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/keccak_round.sv rtl/keccak_f1600.sv rtl/shake_128.sv --top-module shake_128
      - name: Lint sample_ntt (with shake + keccak deps)
        run: verilator --lint-only -Wall -Wno-UNUSEDSIGNAL rtl/keccak_round.sv rtl/keccak_f1600.sv rtl/shake_128.sv rtl/sample_ntt.sv --top-module sample_ntt

  cocotb:
    name: cocotb (RTL vs Python golden model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus + cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb pytest hypothesis
      - name: q_alu testbench (Barrett + mod_add + mod_sub)
        working-directory: tb
        run: make q_alu
      - name: butterfly testbench (Cooley-Tukey + Montgomery)
        working-directory: tb
        run: make butterfly
      - name: ntt_engine testbench (full 256-pt NTT vs Python ref)
        working-directory: tb
        run: make ntt_engine
      - name: keccak_f1600 testbench (24-round permutation vs Python ref)
        working-directory: tb
        run: make keccak
      - name: sha3_256 testbench (full sponge vs Python ref / hashlib)
        working-directory: tb
        run: make sha3_256
      - name: shake_128 testbench (arbitrary-output sponge vs Python ref)
        working-directory: tb
        run: make shake_128
      - name: sample_ntt testbench (Kyber matrix-A rejection sampler)
        working-directory: tb
        run: make sample_ntt
